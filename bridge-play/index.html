<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bridge Play Tutor - Learn to Play Bridge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

/* ===== CSS VARIABLES ===== */
:root {
  --green: #58cc02;
  --green-dark: #46a302;
  --green-light: #d7ffb8;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --red: #ff4b4b;
  --red-dark: #ea2b2b;
  --orange: #ff9600;
  --orange-dark: #cd7b00;
  --purple: #ce82ff;
  --purple-dark: #a855f7;
  --gold: #ffc800;
  --gold-dark: #e6b400;
  --gray: #e5e5e5;
  --gray-dark: #afafaf;
  --gray-darker: #777;
  --bg: #131f24;
  --bg-light: #1a2b33;
  --bg-card: #233340;
  --text: #ffffff;
  --text-dim: #93a8b4;
  --heart: #ff4b4b;
  --suit-red: #e05555;
  --suit-black: #ffffff;

  /* Card rating colors */
  --rating-best: #58cc02;
  --rating-good: #1cb0f6;
  --rating-ok: #ff9600;
  --rating-bad: #ff4b4b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ===== TOP BAR ===== */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--bg-light);
  border-bottom: 2px solid var(--bg-card);
  padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.top-bar-title {
  font-size: 1.15rem;
  font-weight: 900;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}

.top-bar-xp {
  display: flex;
  align-items: center;
  gap: 5px;
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--gold);
}

.top-bar-back {
  display: none;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
  transition: color 0.15s, background 0.15s;
}
.top-bar-back:hover { color: var(--text); background: var(--bg-card); }

/* ===== SCREENS ===== */
.screen { display: none; }
.screen.active { display: block; }

/* ===== MENU SCREEN ===== */
.menu-container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  padding-bottom: max(40px, env(safe-area-inset-bottom));
}

.menu-stats-row {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
}

.menu-stat-card {
  flex: 1;
  background: var(--bg-card);
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
  border: 2px solid #2e4050;
}

.menu-stat-value {
  font-size: 1.6rem;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 4px;
}

.menu-stat-label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.menu-section-title {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}

.menu-card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 18px 16px;
  margin-bottom: 14px;
  border: 2px solid #2e4050;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
}
.menu-card:hover { border-color: var(--green); transform: translateY(-1px); }
.menu-card:active { transform: translateY(0); }

.menu-card-icon {
  font-size: 2rem;
  width: 48px;
  text-align: center;
  flex-shrink: 0;
}

.menu-card-body { flex: 1; min-width: 0; }

.menu-card-title {
  font-size: 1rem;
  font-weight: 800;
  margin-bottom: 3px;
}

.menu-card-desc {
  font-size: 0.8rem;
  color: var(--text-dim);
  line-height: 1.35;
}

.menu-card-badge {
  font-size: 0.7rem;
  font-weight: 800;
  padding: 4px 8px;
  border-radius: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}

.badge-green { background: var(--green); color: #000; }
.badge-blue { background: var(--blue); color: #000; }
.badge-orange { background: var(--orange); color: #000; }
.badge-lock { background: var(--bg-light); color: var(--text-dim); border: 1px solid #3a5060; }

.menu-card.locked {
  opacity: 0.6;
  cursor: not-allowed;
}
.menu-card.locked:hover { border-color: #2e4050; transform: none; }

.menu-progress-bar {
  height: 6px;
  background: var(--bg-light);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 8px;
}
.menu-progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  transition: width 0.4s ease;
}

.menu-cross-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg-light);
  border-radius: 12px;
  border: 1px solid #2e4050;
  text-decoration: none;
  color: var(--text-dim);
  font-size: 0.85rem;
  font-weight: 700;
  margin-top: 24px;
  transition: color 0.15s, border-color 0.15s;
}
.menu-cross-link:hover { color: var(--text); border-color: var(--purple); }

/* ===== GUIDED LIST SCREEN ===== */
.guided-container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  padding-bottom: max(40px, env(safe-area-inset-bottom));
}

.guided-header {
  margin-bottom: 20px;
}

.guided-header h2 {
  font-size: 1.3rem;
  font-weight: 900;
  margin-bottom: 4px;
}

.guided-header p {
  font-size: 0.85rem;
  color: var(--text-dim);
  line-height: 1.4;
}

.guided-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.guided-item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-card);
  border-radius: 14px;
  padding: 14px;
  border: 2px solid #2e4050;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.guided-item:hover { border-color: var(--blue); transform: translateY(-1px); }
.guided-item:active { transform: translateY(0); }
.guided-item.completed { border-color: var(--green-dark); }

.guided-item-num {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  font-weight: 800;
  color: var(--text-dim);
  flex-shrink: 0;
}
.guided-item.completed .guided-item-num {
  background: var(--green);
  color: #000;
}

.guided-item-body { flex: 1; min-width: 0; }

.guided-item-title {
  font-size: 0.95rem;
  font-weight: 800;
  margin-bottom: 2px;
}

.guided-item-concept {
  font-size: 0.78rem;
  color: var(--text-dim);
}

.guided-item-stars {
  font-size: 0.85rem;
  letter-spacing: 1px;
  flex-shrink: 0;
}

/* ===== GAME SCREEN ===== */
.game-container {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 0 env(safe-area-inset-bottom);
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 52px);
  min-height: calc(100dvh - 52px);
}

/* Contract bar */
.contract-bar {
  background: var(--bg-light);
  border-bottom: 1px solid var(--bg-card);
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.82rem;
  font-weight: 700;
}

.contract-info { color: var(--text-dim); }
.contract-info span { color: var(--text); }

.trick-count {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
}

.trick-pips {
  display: flex;
  gap: 3px;
}

.trick-pip {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid #3a5060;
}
.trick-pip.ns { background: var(--green); border-color: var(--green); }
.trick-pip.ew { background: var(--red); border-color: var(--red); }

/* Lesson tip banner */
.lesson-tip {
  background: #1a2e3a;
  border-bottom: 1px solid var(--blue);
  padding: 8px 14px;
  font-size: 0.8rem;
  color: var(--blue);
  font-weight: 700;
  line-height: 1.35;
  display: none;
}
.lesson-tip.visible { display: block; }

/* Table area */
.table-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 10px;
  gap: 6px;
  position: relative;
}

/* North hand (dummy) */
.dummy-hand {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 6px 8px;
  background: var(--bg-light);
  border-radius: 12px;
  border: 1px solid #2e4050;
  max-width: 100%;
}

.dummy-suit-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.dummy-suit-label {
  font-size: 0.7rem;
  font-weight: 800;
  margin-bottom: 2px;
}

.dummy-card-mini {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 2px 4px;
  background: var(--bg-card);
  border-radius: 4px;
  border: 1px solid #3a5060;
  cursor: default;
  line-height: 1;
}

/* Seat labels */
.seat-labels {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 0 4px;
}

.seat-label {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  min-width: 40px;
  text-align: center;
}
.seat-label.active { color: var(--gold); }
.seat-label.you { color: var(--green); }

/* Current trick display */
.current-trick {
  display: grid;
  grid-template-columns: 60px 1fr 60px;
  grid-template-rows: auto auto auto;
  gap: 4px;
  align-items: center;
  justify-items: center;
  width: 200px;
}

.trick-slot {
  width: 52px;
  height: 72px;
  border-radius: 6px;
  border: 2px dashed #2e4050;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.trick-slot.north { grid-column: 2; grid-row: 1; }
.trick-slot.west  { grid-column: 1; grid-row: 2; }
.trick-slot.center-label { grid-column: 2; grid-row: 2; font-size: 0.65rem; color: var(--text-dim); font-weight: 700; }
.trick-slot.east  { grid-column: 3; grid-row: 2; }
.trick-slot.south { grid-column: 2; grid-row: 3; }

.trick-slot.winning { border-color: var(--gold); border-style: solid; }

/* Playing card in trick */
.play-card {
  width: 48px;
  height: 68px;
  border-radius: 6px;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  font-weight: 900;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  position: relative;
  user-select: none;
}

.play-card .card-rank {
  font-size: 0.85rem;
  line-height: 1;
}

.play-card .card-suit-sym {
  font-size: 1.1rem;
  line-height: 1;
}

.play-card.red { color: var(--suit-red); }
.play-card.black { color: #1a1a2e; }

/* Player hand (South) */
.player-hand-area {
  background: var(--bg-light);
  border-top: 2px solid var(--bg-card);
  padding: 10px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
}

.player-hand-label {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.player-cards-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: center;
}

/* Hand card (clickable) */
.hand-card {
  width: 44px;
  height: 64px;
  border-radius: 7px;
  background: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 2px solid transparent;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
  transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.hand-card:hover { transform: translateY(-6px); }
.hand-card:active { transform: translateY(-3px); }

.hand-card .card-rank {
  font-size: 0.78rem;
  font-weight: 900;
  line-height: 1;
  color: inherit;
}

.hand-card .card-suit-sym {
  font-size: 1rem;
  line-height: 1;
  color: inherit;
}

.hand-card.red { color: var(--suit-red); }
.hand-card.black { color: #1a1a2e; }

.hand-card.not-playable {
  opacity: 0.38;
  cursor: not-allowed;
}
.hand-card.not-playable:hover { transform: none; }

/* Card rating overlays */
.hand-card.rate-best  { border-color: var(--rating-best);  box-shadow: 0 0 10px rgba(88,204,2,0.5); }
.hand-card.rate-good  { border-color: var(--rating-good);  box-shadow: 0 0 10px rgba(28,176,246,0.5); }
.hand-card.rate-ok    { border-color: var(--rating-ok);    box-shadow: 0 0 10px rgba(255,150,0,0.5); }
.hand-card.rate-bad   { border-color: var(--rating-bad);   box-shadow: 0 0 10px rgba(255,75,75,0.5); }

.card-star-badge {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.55rem;
  font-weight: 900;
  z-index: 2;
}
.badge-best  { background: var(--rating-best);  color: #000; }
.badge-good  { background: var(--rating-good);  color: #000; }
.badge-ok    { background: var(--rating-ok);    color: #000; }
.badge-bad   { background: var(--rating-bad);   color: #fff; }

/* ===== TRICK REVIEW PANEL (slide-up) ===== */
.review-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(0,0,0,0.55);
  align-items: flex-end;
  justify-content: center;
}
.review-overlay.visible {
  display: flex;
  animation: fadeIn 0.2s ease;
}

.review-panel {
  background: var(--bg-light);
  border-radius: 20px 20px 0 0;
  border-top: 2px solid var(--bg-card);
  padding: 20px 18px;
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  width: 100%;
  max-width: 480px;
  animation: slideUp 0.28s cubic-bezier(0.34,1.56,0.64,1);
}

.review-panel-title {
  font-size: 1rem;
  font-weight: 900;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.review-panel-explanation {
  font-size: 0.82rem;
  color: var(--text-dim);
  line-height: 1.45;
  margin-bottom: 14px;
}

.review-trick-cards {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 16px;
}

.review-trick-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.review-trick-card-label {
  font-size: 0.65rem;
  font-weight: 800;
  color: var(--text-dim);
  text-transform: uppercase;
}

.review-card-chip {
  padding: 4px 8px;
  border-radius: 6px;
  background: white;
  font-size: 0.85rem;
  font-weight: 800;
}
.review-card-chip.red { color: var(--suit-red); }
.review-card-chip.black { color: #1a1a2e; }
.review-card-chip.winner { box-shadow: 0 0 8px var(--gold); border: 2px solid var(--gold); }

.review-rating-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 14px;
  font-size: 0.85rem;
  font-weight: 700;
}
.review-rating-row.best  { background: rgba(88,204,2,0.15);  color: var(--rating-best); }
.review-rating-row.good  { background: rgba(28,176,246,0.15); color: var(--rating-good); }
.review-rating-row.ok    { background: rgba(255,150,0,0.15);  color: var(--rating-ok); }
.review-rating-row.bad   { background: rgba(255,75,75,0.15);  color: var(--rating-bad); }

.review-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  background: var(--green);
  color: #000;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.review-btn:hover { background: var(--green-dark); }
.review-btn:active { transform: scale(0.98); }

/* ===== RESULT SCREEN ===== */
.result-container {
  max-width: 480px;
  margin: 0 auto;
  padding: 30px 16px 40px;
  padding-bottom: max(40px, env(safe-area-inset-bottom));
  text-align: center;
}

.result-emoji {
  font-size: 4rem;
  margin-bottom: 12px;
  animation: bounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

.result-title {
  font-size: 1.6rem;
  font-weight: 900;
  margin-bottom: 6px;
}

.result-subtitle {
  font-size: 0.9rem;
  color: var(--text-dim);
  margin-bottom: 24px;
  line-height: 1.4;
}

.result-stats-row {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 24px;
}

.result-stat {
  background: var(--bg-card);
  border-radius: 14px;
  padding: 14px 18px;
  text-align: center;
  border: 2px solid #2e4050;
  min-width: 90px;
}

.result-stat-value {
  font-size: 1.5rem;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 4px;
}

.result-stat-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.key-moments {
  text-align: left;
  margin-bottom: 24px;
}

.key-moments-title {
  font-size: 0.75rem;
  font-weight: 800;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 10px;
}

.key-moment-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 0.82rem;
}

.key-moment-trick {
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--text-dim);
  min-width: 50px;
  text-transform: uppercase;
  padding-top: 1px;
}

.key-moment-text {
  flex: 1;
  line-height: 1.4;
  color: var(--text-dim);
}

.key-moment-text strong { color: var(--text); }

.result-xp-banner {
  background: linear-gradient(135deg, #1a3a1a, #1e3d10);
  border: 2px solid var(--green-dark);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.result-xp-icon { font-size: 2rem; }

.result-xp-info { text-align: left; }

.result-xp-earned {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--gold);
}

.result-xp-reason {
  font-size: 0.78rem;
  color: var(--text-dim);
}

.result-btn-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.result-btn {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}
.result-btn:active { transform: scale(0.98); }

.result-btn.primary { background: var(--green); color: #000; }
.result-btn.primary:hover { background: var(--green-dark); }

.result-btn.secondary { background: var(--bg-card); color: var(--text); border: 2px solid #3a5060; }

<script>
'use strict';

/* =============================================================
   1. CONSTANTS
   ============================================================= */
const SUITS = ['S', 'H', 'D', 'C'];
const SUIT_SYMBOLS = { S: '♠', H: '♥', D: '♦', C: '♣' };
const SUIT_COLORS  = { S: 'black', H: 'red', D: 'red', C: 'black' };
const SUIT_NAMES   = { S: 'Spades', H: 'Hearts', D: 'Diamonds', C: 'Clubs' };
const SEATS = ['N', 'E', 'S', 'W'];
const SEAT_NAMES = { N: 'North', E: 'East', S: 'South', W: 'West' };
const RANK_ORDER = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const RANK_VAL   = Object.fromEntries(RANK_ORDER.map((r,i) => [r, i]));
const RANK_DISPLAY = { T: '10', J: 'J', Q: 'Q', K: 'K', A: 'A' };

/* =============================================================
   2. STATE (persisted)
   ============================================================= */
const STORAGE_KEY = 'bridgePlayState';

const state = {
  xp: 0,
  handsPlayed: 0,
  contractsMade: 0,
  totalOptimal: 0,  // sum of optimal play scores
  totalPlays: 0,    // total play-decisions made
  completedGuided: [], // indices of completed guided hands
  biddingUnlocked: false,
};

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
    }
    // Sync XP from bridge-tutor if higher
    const tutorRaw = localStorage.getItem('bridgeTutorState');
    if (tutorRaw) {
      const tutor = JSON.parse(tutorRaw);
      if (tutor.xp && tutor.xp > state.xp) {
        state.xp = tutor.xp;
      }
    }
  } catch (e) {
    console.warn('loadState error', e);
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('saveState error', e);
  }
}

/* =============================================================
   3. GAME STATE
   ============================================================= */
const game = {
  mode: null,          // 'guided' | 'free'
  guidedIdx: null,     // index into GUIDED_HANDS

  // Hands: { N, E, S, W } each is array of card strings e.g. 'AH', 'KS'
  hands: null,
  originalHands: null,

  trump: null,         // 'S'|'H'|'D'|'C'|'N' (N = notrump)
  contract: null,      // e.g. '3N', '4S'
  declarer: null,      // 'N'|'E'|'S'|'W'
  dummy: null,         // partner of declarer

  currentTrick: [],    // array of { seat, card } in play order
  leader: null,        // seat leading current trick
  turn: null,          // seat to play next
  tricksNS: 0,
  tricksEW: 0,
  trickNum: 1,         // 1-13
  target: 0,           // tricks declarer's side needs to make contract
  phase: 'play',       // 'play' | 'review' | 'done'

  selectedCard: null,

  trickHistory: [],    // array of { plays:[{seat,card}], winner, explanation, playerRating }
  playerRatings: [],   // rating per trick where player played: 'best'|'good'|'ok'|'bad'
  playerChoices: [],   // { trickNum, card, rating, explanation } for key moments
};

/* =============================================================
   4. CARD HELPERS
   ============================================================= */

/** Build HTML for a card chip (e.g. in trick/review areas) */
function cardHTML(card, extraClass = '') {
  const rank = card.slice(0, -1);
  const suit = card.slice(-1);
  const color = SUIT_COLORS[suit];
  const sym   = SUIT_SYMBOLS[suit];
  const disp  = RANK_DISPLAY[rank] || rank;
  return `<div class="play-card ${color} ${extraClass}">
    <div class="card-rank">${disp}</div>
    <div class="card-suit-sym">${sym}</div>
  </div>`;
}

/** Inline suit span (colored symbol) */
function suitSpan(suit) {
  return `<span style="color:${SUIT_COLORS[suit]==='red'?'var(--suit-red)':'var(--suit-black)'}">${SUIT_SYMBOLS[suit]}</span>`;
}

function nextSeat(seat) {
  return SEATS[(SEATS.indexOf(seat) + 1) % 4];
}

function partnerOf(seat) {
  return SEATS[(SEATS.indexOf(seat) + 2) % 4];
}

/** Is this seat controlled by the human (South or dummy when dummy plays) */
function isPlayerControlled(seat) {
  // South always controlled by player; in bridge play, dummy is played by declarer
  // We simplify: player controls South (declarer side simplified)
  return seat === 'S';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sortHand(hand) {
  // Sort by suit order (S,H,D,C) then rank descending within suit
  return [...hand].sort((a, b) => {
    const sa = a.slice(-1), sb = b.slice(-1);
    const ra = a.slice(0,-1), rb = b.slice(0,-1);
    if (sa !== sb) return SUITS.indexOf(sa) - SUITS.indexOf(sb);
    return RANK_VAL[rb] - RANK_VAL[ra];
  });
}

function sortAllHands() {
  SEATS.forEach(s => {
    if (game.hands[s]) game.hands[s] = sortHand(game.hands[s]);
  });
}

function suitOfLed() {
  if (game.currentTrick.length === 0) return null;
  return game.currentTrick[0].card.slice(-1);
}

/** Check if playing `card` from `seat` is legal */
function canPlayCard(card, seat) {
  const hand = game.hands[seat];
  if (!hand || !hand.includes(card)) return false;

  const led = suitOfLed();
  if (!led) return true; // leading to trick — any card ok

  const cardSuit = card.slice(-1);
  const hasSuit = hand.some(c => c.slice(-1) === led);
  if (hasSuit) return cardSuit === led; // must follow suit
  return true; // can play anything
}

function getPlayableCards(seat) {
  return (game.hands[seat] || []).filter(c => canPlayCard(c, seat));
}

/** Determine winner of completed trick */
function trickWinner(plays) {
  const trump = game.trump;
  const ledSuit = plays[0].card.slice(-1);

  let best = plays[0];
  for (let i = 1; i < plays.length; i++) {
    const p = plays[i];
    const pSuit = p.card.slice(-1);
    const bestSuit = best.card.slice(-1);

    const pIsTrump   = trump !== 'N' && pSuit === trump;
    const bestIsTrump = trump !== 'N' && bestSuit === trump;

    if (pIsTrump && !bestIsTrump) {
      best = p;
    } else if (!pIsTrump && bestIsTrump) {
      // best stays
    } else if (pSuit === bestSuit) {
      if (RANK_VAL[p.card.slice(0,-1)] > RANK_VAL[best.card.slice(0,-1)]) best = p;
    }
    // else p is off-suit non-trump — can't win
  }
  return best.seat;
}

/** Current best card in the trick so far */
function trickCurrentBest() {
  if (game.currentTrick.length === 0) return null;
  return trickWinner(game.currentTrick);
}

/** Would playing `card` beat what's currently winning in the trick? */
function wouldBeat(card, seat) {
  if (game.currentTrick.length === 0) return true; // leading
  const hypo = [...game.currentTrick, { seat, card }];
  return trickWinner(hypo) === seat;
}

   5. SCREEN MANAGEMENT
   ============================================================= */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(name + 'Screen');
  if (el) el.classList.add('active');

  const backBtn = document.getElementById('topBarBack');
  if (name === 'menu') {
    backBtn.style.display = 'none';
  } else {
    backBtn.style.display = 'flex';
  }
}

function updateXP() {
  document.getElementById('xpDisplay').textContent = state.xp;
}

function handleBack() {
  // Determine which screen is active and go back
  const active = document.querySelector('.screen.active');
  if (!active) return;
  const id = active.id;

  if (id === 'guidedScreen') { showScreen('menu'); renderMenu(); }
  else if (id === 'gameScreen') {
    if (game.mode === 'guided') { showScreen('guided'); showGuidedList(); }
    else { showScreen('menu'); renderMenu(); }
  }
  else if (id === 'resultScreen') {
    if (game.mode === 'guided') { showScreen('guided'); showGuidedList(); }
    else { showScreen('menu'); renderMenu(); }
  }
  else if (id === 'replayScreen') { showScreen('result'); /* result still rendered */ }
  else { showScreen('menu'); renderMenu(); }
}

/* =============================================================
   8. GUIDED LIST RENDERING
   ============================================================= */
function showGuidedList() {
  showScreen('guided');
  document.getElementById('topBarBack').style.display = 'flex';

  const items = GUIDED_HANDS.map((hand, i) => {
    const done = state.completedGuided.includes(i);
    const stars = done ? '⭐⭐⭐' : '○○○';
    return `
      <div class="guided-item ${done ? 'completed' : ''}" onclick="startGuidedHand(${i})">
        <div class="guided-item-num">${done ? '✓' : i + 1}</div>
        <div class="guided-item-body">
          <div class="guided-item-title">${hand.title}</div>
          <div class="guided-item-concept">${hand.concept}</div>
        </div>
        <div class="guided-item-stars">${done ? '⭐⭐⭐' : '○○○'}</div>
      </div>
    `;
  }).join('');

  const html = `
    <div class="guided-header">
      <h2>Guided Hands</h2>
      <p>Play through 8 curated deals, each teaching a key card-play concept.</p>
    </div>
    <div class="guided-list">
      ${items}
    </div>
  `;

  document.getElementById('guidedContainer').innerHTML = html;
}
