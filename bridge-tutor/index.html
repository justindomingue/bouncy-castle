<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Tutor - Learn Bridge the Fun Way</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

:root {
  --green: #58cc02;
  --green-dark: #46a302;
  --green-light: #d7ffb8;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --red: #ff4b4b;
  --red-dark: #ea2b2b;
  --orange: #ff9600;
  --orange-dark: #cd7b00;
  --purple: #ce82ff;
  --purple-dark: #a855f7;
  --gold: #ffc800;
  --gold-dark: #e6b400;
  --gray: #e5e5e5;
  --gray-dark: #afafaf;
  --gray-darker: #777;
  --bg: #131f24;
  --bg-light: #1a2b33;
  --bg-card: #233340;
  --text: #ffffff;
  --text-dim: #93a8b4;
  --heart: #ff4b4b;
  --correct-bg: #1b3a1b;
  --wrong-bg: #3a1b1b;
  --suit-red: #e74c3c;
  --suit-black: #2c3e50;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== TOP NAV ===== */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-light);
  border-bottom: 2px solid var(--bg-card);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-logo {
  font-size: 1.3rem;
  font-weight: 900;
  color: var(--green);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

.nav-stats {
  display: flex;
  align-items: center;
  gap: 20px;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 1rem;
}

.stat-icon { font-size: 1.2rem; }

.streak-fire { color: var(--orange); }
.xp-bolt { color: var(--gold); }
.heart-icon { color: var(--heart); }
.gem-icon { color: var(--blue); }

/* ===== SCREENS ===== */
.screen { display: none; }
.screen.active { display: block; }

/* ===== HOME / PATH SCREEN ===== */
.path-container {
  max-width: 500px;
  margin: 0 auto;
  padding: 30px 20px 100px;
}

.unit-header {
  background: linear-gradient(135deg, var(--green), var(--green-dark));
  border-radius: 16px;
  padding: 20px 24px;
  margin-bottom: 24px;
  cursor: pointer;
  transition: transform 0.15s;
}

.unit-header:hover { transform: scale(1.02); }

.unit-header.locked {
  background: linear-gradient(135deg, var(--gray-dark), var(--gray-darker));
  opacity: 0.6;
}

.unit-header.blue-theme { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); }
.unit-header.purple-theme { background: linear-gradient(135deg, var(--purple), var(--purple-dark)); }
.unit-header.orange-theme { background: linear-gradient(135deg, var(--orange), var(--orange-dark)); }
.unit-header.gold-theme { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); }
.unit-header.red-theme { background: linear-gradient(135deg, var(--red), var(--red-dark)); }

.unit-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; opacity: 0.9; }
.unit-title { font-size: 1.3rem; font-weight: 900; margin-top: 4px; }
.unit-desc { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }

.lesson-nodes {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  position: relative;
}

.lesson-node {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  font-weight: 900;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
  border: 4px solid transparent;
}

.lesson-node:hover:not(.locked) { transform: scale(1.1); }

.lesson-node.available {
  background: var(--green);
  border-color: var(--green-dark);
  box-shadow: 0 6px 0 var(--green-dark);
  color: white;
}

.lesson-node.available:active {
  box-shadow: 0 2px 0 var(--green-dark);
  transform: translateY(4px);
}

.lesson-node.completed {
  background: var(--gold);
  border-color: var(--gold-dark);
  box-shadow: 0 4px 0 var(--gold-dark);
  color: white;
}

.lesson-node.locked {
  background: var(--bg-card);
  border-color: #3a4a55;
  box-shadow: 0 4px 0 #2a3a44;
  color: var(--gray-dark);
  cursor: not-allowed;
}

.node-crown {
  position: absolute;
  top: -18px;
  font-size: 1.3rem;
}

.lesson-connector {
  width: 4px;
  height: 16px;
  background: var(--bg-card);
  border-radius: 2px;
}

.lesson-connector.active { background: var(--green-dark); }

/* offset nodes for zigzag path */
.lesson-nodes .lesson-node:nth-child(odd) { margin-left: -60px; }
.lesson-nodes .lesson-node:nth-child(even) { margin-right: -60px; }

/* ===== LESSON SCREEN ===== */
.lesson-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
  min-height: calc(100vh - 70px);
  display: flex;
  flex-direction: column;
}

.progress-bar-container {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 30px;
}

.progress-close {
  font-size: 1.5rem;
  cursor: pointer;
  color: var(--text-dim);
  background: none;
  border: none;
  padding: 4px;
}

.progress-bar {
  flex: 1;
  height: 16px;
  background: var(--bg-card);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--green);
  border-radius: 10px;
  transition: width 0.4s ease;
}

.progress-hearts {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 700;
  color: var(--heart);
}

/* Lesson content area */
.lesson-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.lesson-prompt {
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 8px;
  line-height: 1.3;
}

.lesson-instruction {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 24px;
}

/* Teaching slides */
.teach-slide {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 24px;
}

.teach-slide h3 {
  font-size: 1.2rem;
  color: var(--green);
  margin-bottom: 12px;
}

.teach-slide p {
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 12px;
}

.teach-slide .highlight {
  color: var(--gold);
  font-weight: 700;
}

.teach-slide .card-display {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 16px 0;
}

.mini-card {
  width: 52px;
  height: 74px;
  background: white;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  border: 2px solid #ddd;
}

.mini-card.red { color: var(--suit-red); }
.mini-card.black { color: var(--suit-black); }

.mini-card .card-rank { font-size: 1.1rem; line-height: 1; }
.mini-card .card-suit { font-size: 1.2rem; line-height: 1; }

.suit-symbol { font-weight: 900; }
.suit-symbol.spade { color: var(--suit-black); }
.suit-symbol.heart { color: var(--suit-red); }
.suit-symbol.diamond { color: var(--suit-red); }
.suit-symbol.club { color: var(--suit-black); }

/* Multiple choice */
.choices {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.choice-btn {
  background: var(--bg-card);
  border: 2px solid #3a4a55;
  border-radius: 14px;
  padding: 16px 20px;
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
  font-family: inherit;
}

.choice-btn:hover { border-color: var(--blue); background: rgba(28, 176, 246, 0.1); }
.choice-btn.selected { border-color: var(--blue); background: rgba(28, 176, 246, 0.15); }
.choice-btn.correct { border-color: var(--green); background: rgba(88, 204, 2, 0.15); }
.choice-btn.wrong { border-color: var(--red); background: rgba(255, 75, 75, 0.15); }

/* True/False */
.tf-buttons {
  display: flex;
  gap: 16px;
}

.tf-btn {
  flex: 1;
  padding: 20px;
  border-radius: 14px;
  font-size: 1.2rem;
  font-weight: 800;
  cursor: pointer;
  border: 3px solid;
  transition: all 0.15s;
  font-family: inherit;
  background: var(--bg-card);
}

.tf-btn.true-btn { border-color: var(--green); color: var(--green); }
.tf-btn.false-btn { border-color: var(--red); color: var(--red); }
.tf-btn:hover { transform: scale(1.03); }
.tf-btn.selected.true-btn { background: rgba(88, 204, 2, 0.2); }
.tf-btn.selected.false-btn { background: rgba(255, 75, 75, 0.2); }

/* Match pairs */
.match-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.match-item {
  background: var(--bg-card);
  border: 2px solid #3a4a55;
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 0.95rem;
}

.match-item:hover { border-color: var(--blue); }
.match-item.selected { border-color: var(--blue); background: rgba(28, 176, 246, 0.15); }
.match-item.matched { border-color: var(--green); background: rgba(88, 204, 2, 0.1); opacity: 0.6; pointer-events: none; }
.match-item.wrong-match { border-color: var(--red); background: rgba(255, 75, 75, 0.15); }

/* Order/Sort exercise */
.sort-items {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sort-item {
  background: var(--bg-card);
  border: 2px solid #3a4a55;
  border-radius: 12px;
  padding: 14px 18px;
  font-weight: 700;
  cursor: grab;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s;
  user-select: none;
}

.sort-item:hover { border-color: var(--blue); }
.sort-item .sort-handle { color: var(--text-dim); font-size: 1.2rem; }
.sort-item.dragging { opacity: 0.5; border-color: var(--blue); }

.sort-slot {
  min-height: 54px;
  border: 2px dashed #3a4a55;
  border-radius: 12px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: var(--text-dim);
  font-size: 0.9rem;
}

/* Fill in the blank */
.fill-blank-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 20px;
}

.word-bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 16px;
  background: var(--bg-card);
  border-radius: 12px;
}

.word-chip {
  background: var(--bg-light);
  border: 2px solid #3a4a55;
  border-radius: 10px;
  padding: 8px 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  font-size: 1rem;
  color: var(--text);
}

.word-chip:hover { border-color: var(--blue); }
.word-chip.used { opacity: 0.3; pointer-events: none; }

/* Interactive trick play */
.trick-area {
  background: #1a5c2a;
  border-radius: 20px;
  padding: 30px;
  margin: 16px 0;
  position: relative;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.trick-center {
  display: grid;
  grid-template-areas:
    ". north ."
    "west center east"
    ". south .";
  gap: 8px;
  align-items: center;
  justify-items: center;
}

.trick-pos {
  width: 60px;
  height: 80px;
  border: 2px dashed rgba(255,255,255,0.3);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.trick-pos.north { grid-area: north; }
.trick-pos.south { grid-area: south; }
.trick-pos.east { grid-area: east; }
.trick-pos.west { grid-area: west; }
.trick-pos .mini-card { transform: scale(0.9); }

.player-hand {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}

.hand-card {
  width: 56px;
  height: 78px;
  background: white;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 3px solid #ccc;
  transition: all 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}

.hand-card:hover { transform: translateY(-8px); border-color: var(--blue); }
.hand-card.selected { transform: translateY(-12px); border-color: var(--gold); }
.hand-card .card-rank { font-size: 1.1rem; font-weight: 900; line-height: 1; }
.hand-card .card-suit { font-size: 1.3rem; line-height: 1; }
.hand-card.red { color: var(--suit-red); }
.hand-card.black { color: var(--suit-black); }

/* Bottom check bar */
.check-bar {
  padding: 20px;
  margin-top: auto;
}

.check-btn {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  font-size: 1.1rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.check-btn.primary {
  background: var(--green);
  color: white;
  box-shadow: 0 5px 0 var(--green-dark);
}

.check-btn.primary:active {
  box-shadow: 0 2px 0 var(--green-dark);
  transform: translateY(3px);
}

.check-btn.primary:disabled {
  background: var(--bg-card);
  color: var(--gray-dark);
  box-shadow: 0 4px 0 #2a3a44;
  cursor: not-allowed;
}

.check-btn.continue {
  background: var(--blue);
  color: white;
  box-shadow: 0 5px 0 var(--blue-dark);
}

.check-btn.skip {
  background: transparent;
  color: var(--text-dim);
  border: 2px solid var(--bg-card);
  box-shadow: none;
  font-size: 0.95rem;
  margin-top: 8px;
}

/* Feedback banner */
.feedback-banner {
  padding: 16px 20px;
  border-radius: 14px;
  margin-bottom: 12px;
  display: none;
  align-items: center;
  gap: 12px;
  animation: slideUp 0.3s ease;
}

.feedback-banner.correct {
  display: flex;
  background: var(--correct-bg);
  border: 2px solid var(--green);
}

.feedback-banner.wrong {
  display: flex;
  background: var(--wrong-bg);
  border: 2px solid var(--red);
}

.feedback-icon { font-size: 1.5rem; }
.feedback-text { font-weight: 700; font-size: 1rem; }
.feedback-explain { font-weight: 400; font-size: 0.9rem; color: var(--text-dim); margin-top: 4px; }

/* ===== LESSON COMPLETE ===== */
.complete-screen {
  max-width: 500px;
  margin: 0 auto;
  padding: 40px 20px;
  text-align: center;
}

.complete-icon {
  font-size: 4rem;
  margin-bottom: 16px;
  animation: bounceIn 0.6s ease;
}

.complete-title {
  font-size: 2rem;
  font-weight: 900;
  color: var(--gold);
  margin-bottom: 8px;
}

.complete-subtitle {
  color: var(--text-dim);
  font-size: 1.1rem;
  margin-bottom: 32px;
}

.complete-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-bottom: 40px;
}

.complete-stat {
  text-align: center;
}

.complete-stat-value {
  font-size: 2rem;
  font-weight: 900;
  color: var(--green);
}

.complete-stat-label {
  font-size: 0.85rem;
  color: var(--text-dim);
  font-weight: 600;
}

.complete-btn {
  width: 100%;
  max-width: 300px;
  padding: 16px;
  border-radius: 14px;
  font-size: 1.1rem;
  font-weight: 800;
  border: none;
  cursor: pointer;
  font-family: inherit;
  background: var(--green);
  color: white;
  box-shadow: 0 5px 0 var(--green-dark);
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: all 0.15s;
}

.complete-btn:active {
  box-shadow: 0 2px 0 var(--green-dark);
  transform: translateY(3px);
}

/* ===== TIP BOX ===== */
.tip-box {
  background: rgba(28, 176, 246, 0.1);
  border: 2px solid var(--blue);
  border-radius: 12px;
  padding: 16px;
  margin: 16px 0;
  display: flex;
  gap: 12px;
}

.tip-icon { font-size: 1.3rem; flex-shrink: 0; }
.tip-text { font-size: 0.95rem; line-height: 1.5; }

/* ===== TABLE DIAGRAM ===== */
.table-diagram {
  width: 200px;
  height: 200px;
  background: #1a5c2a;
  border-radius: 50%;
  margin: 16px auto;
  position: relative;
  border: 4px solid #2a7c3a;
}

.table-player {
  position: absolute;
  font-weight: 800;
  font-size: 0.85rem;
  background: var(--bg-card);
  padding: 6px 12px;
  border-radius: 8px;
  white-space: nowrap;
}

.table-player.north { top: -14px; left: 50%; transform: translateX(-50%); }
.table-player.south { bottom: -14px; left: 50%; transform: translateX(-50%); }
.table-player.east { right: -20px; top: 50%; transform: translateY(-50%); }
.table-player.west { left: -20px; top: 50%; transform: translateY(-50%); }

.table-player.partner { color: var(--green); border: 2px solid var(--green); }
.table-player.opponent { color: var(--red); border: 2px solid var(--red); }
.table-player.you { color: var(--gold); border: 2px solid var(--gold); }

/* ===== BIDDING BOX ===== */
.bid-display {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 16px 0;
}

.bid-chip {
  background: var(--bg-light);
  border: 2px solid #3a4a55;
  border-radius: 10px;
  padding: 10px 16px;
  font-weight: 800;
  font-size: 1rem;
  display: flex;
  align-items: center;
  gap: 4px;
}

.bid-chip.pass { color: var(--gray-dark); }
.bid-chip .bid-level { font-size: 1.1rem; }

/* ===== SCORING TABLE ===== */
.score-table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 0.9rem;
}

.score-table th, .score-table td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid #3a4a55;
}

.score-table th {
  color: var(--green);
  font-weight: 800;
  font-size: 0.8rem;
  text-transform: uppercase;
}

/* ===== ANIMATIONS ===== */
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes bounceIn {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.1); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes correctShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.animate-correct { animation: bounceIn 0.4s ease; }
.animate-wrong { animation: correctShake 0.3s ease; }

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .lesson-prompt { font-size: 1.25rem; }
  .mini-card { width: 44px; height: 64px; font-size: 0.75rem; }
  .hand-card { width: 48px; height: 68px; }
  .table-diagram { width: 160px; height: 160px; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg-card); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a4a55; }

/* Point values diagram */
.point-cards {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 16px 0;
  flex-wrap: wrap;
}

.point-card-item {
  text-align: center;
}

.point-value {
  background: var(--gold);
  color: #000;
  font-weight: 900;
  font-size: 1.1rem;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 6px auto 0;
}

/* Bidding ladder */
.bid-ladder {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  margin: 16px 0;
}

.bid-rung {
  display: flex;
  gap: 8px;
  align-items: center;
}

const SUITS = { S: '♠', H: '♥', D: '♦', C: '♣' };
const SUIT_COLORS = { S: 'black', H: 'red', D: 'red', C: 'black' };

function cardHTML(rank, suit, extra='') {
  const s = SUITS[suit] || suit;
  const c = SUIT_COLORS[suit] || (suit === '♥' || suit === '♦' ? 'red' : 'black');
  return `<div class="mini-card ${c} ${extra}"><span class="card-rank">${rank}</span><span class="card-suit">${s}</span></div>`;
}

function handCardHTML(rank, suit, idx) {
  const s = SUITS[suit] || suit;
  const c = SUIT_COLORS[suit] || 'black';
  return `<div class="hand-card ${c}" data-idx="${idx}" onclick="selectHandCard(${idx})"><span class="card-rank">${rank}</span><span class="card-suit">${s}</span></div>`;
}

function suitSpan(suit) {
  const syms = { S: '♠', H: '♥', D: '♦', C: '♣', NT: 'NT' };
  const cls = { S: 'spade', H: 'heart', D: 'diamond', C: 'club' };
  return `<span class="suit-symbol ${cls[suit] || ''}">${syms[suit] || suit}</span>`;
}

// ===========================
// RENDER PATH
// ===========================
function renderPath() {
  const container = document.getElementById('pathContainer');
  let html = '';
  let lessonIdx = 0;

  curriculum.forEach((unit, ui) => {
    const unitLocked = ui > 0 && !isUnitUnlocked(ui);
    const themeClass = unitLocked ? 'locked' : (unit.theme || '');

    html += `<div class="unit-header ${themeClass}">
      <div class="unit-label">Unit ${ui + 1}</div>
      <div class="unit-title">${unit.title}</div>
      <div class="unit-desc">${unit.desc}</div>
    </div>`;

    html += `<div class="lesson-nodes">`;
    unit.lessons.forEach((lesson, li) => {
      const lid = `${ui}-${li}`;
      const completed = state.completedLessons.includes(lid);
      const available = !unitLocked && (li === 0 || state.completedLessons.includes(`${ui}-${li-1}`));
      const locked = !completed && !available;

      let cls = completed ? 'completed' : (available ? 'available' : 'locked');
      let icon = completed ? '✓' : (locked ? '🔒' : (li + 1));
      let crown = completed ? '<span class="node-crown">👑</span>' : '';

      html += `<div class="lesson-node ${cls}" onclick="${locked ? '' : `startLesson(${ui},${li})`}" title="${lesson.title}">
        ${crown}
        ${icon}
      </div>`;
      lessonIdx++;
    });
    html += `</div>`;
  });

  container.innerHTML = html;
}

function isUnitUnlocked(unitIdx) {
  if (unitIdx === 0) return true;
  const prevUnit = curriculum[unitIdx - 1];
  const lastLesson = `${unitIdx - 1}-${prevUnit.lessons.length - 1}`;
  return state.completedLessons.includes(lastLesson);
}

// ===========================
// LESSON ENGINE
// ===========================
let currentSteps = [];

function startLesson(unitIdx, lessonIdx) {
  state.currentUnit = unitIdx;
  state.currentLesson = lessonIdx;
  state.currentStep = 0;
  state.lessonCorrect = 0;
  state.lessonTotal = 0;
  state.lessonHearts = state.hearts;
  state.selectedAnswer = null;
  state.checked = false;

  currentSteps = curriculum[unitIdx].lessons[lessonIdx].steps;
  showScreen('lesson');
  renderStep();
}

function renderStep() {
  const step = currentSteps[state.currentStep];
  const contentEl = document.getElementById('lessonContent');
  const checkBtn = document.getElementById('checkBtn');
  const feedback = document.getElementById('feedbackBanner');
  const progressEl = document.getElementById('lessonProgress');

  feedback.className = 'feedback-banner';
  state.selectedAnswer = null;
  state.checked = false;

  const progress = ((state.currentStep) / currentSteps.length) * 100;
  progressEl.style.width = progress + '%';
  document.getElementById('lessonHearts').textContent = state.lessonHearts;

  if (step.type === 'teach') {
    contentEl.innerHTML = `<div class="teach-slide">${step.content}</div>`;
    checkBtn.textContent = 'CONTINUE';
    checkBtn.disabled = false;
    checkBtn.className = 'check-btn continue';
  } else if (step.type === 'mc') {
    let choicesHTML = step.choices.map((c, i) =>
      `<button class="choice-btn" data-idx="${i}" onclick="selectChoice(${i})">${c}</button>`
    ).join('');
    contentEl.innerHTML = `
      <div class="lesson-prompt">${step.prompt}</div>
      <div class="choices">${choicesHTML}</div>
    `;
    checkBtn.textContent = 'CHECK';
    checkBtn.disabled = true;
    checkBtn.className = 'check-btn primary';
  } else if (step.type === 'tf') {
    contentEl.innerHTML = `
      <div class="lesson-prompt">${step.prompt}</div>
      <div class="tf-buttons">
        <button class="tf-btn true-btn" onclick="selectTF(true)">TRUE</button>
        <button class="tf-btn false-btn" onclick="selectTF(false)">FALSE</button>
      </div>
    `;
    checkBtn.textContent = 'CHECK';
    checkBtn.disabled = true;
    checkBtn.className = 'check-btn primary';
  }
}

function selectChoice(idx) {
  if (state.checked) return;
  state.selectedAnswer = idx;
  document.querySelectorAll('.choice-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('checkBtn').disabled = false;
}

function selectTF(val) {
  if (state.checked) return;
  state.selectedAnswer = val;
  document.querySelectorAll('.tf-btn').forEach(btn => {
    btn.classList.remove('selected');
  });
  const cls = val ? '.true-btn' : '.false-btn';
  document.querySelector(cls).classList.add('selected');
  document.getElementById('checkBtn').disabled = false;
}

function handleCheck() {
  const step = currentSteps[state.currentStep];
  const checkBtn = document.getElementById('checkBtn');

  if (step.type === 'teach' || state.checked) {
    // Move to next step
    state.currentStep++;
    if (state.currentStep >= currentSteps.length) {
      showComplete();
    } else {
      renderStep();
    }
    return;
  }

  // Check answer
  state.checked = true;
  state.lessonTotal++;
  let correct = false;

  if (step.type === 'mc') {
    correct = state.selectedAnswer === step.correct;
    document.querySelectorAll('.choice-btn').forEach((btn, i) => {
      if (i === step.correct) btn.classList.add('correct');
      if (i === state.selectedAnswer && !correct) btn.classList.add('wrong');
      btn.style.pointerEvents = 'none';
    });
  } else if (step.type === 'tf') {
    correct = state.selectedAnswer === step.correct;
    if (correct) {
      document.querySelector(step.correct ? '.true-btn' : '.false-btn').style.background = 'rgba(88,204,2,0.3)';
    } else {
      document.querySelector(!step.correct ? '.true-btn' : '.false-btn').style.background = 'rgba(255,75,75,0.3)';
      document.querySelector(step.correct ? '.true-btn' : '.false-btn').style.background = 'rgba(88,204,2,0.3)';
    }
  }

  const feedback = document.getElementById('feedbackBanner');
  const feedbackIcon = document.getElementById('feedbackIcon');
  const feedbackText = document.getElementById('feedbackText');
  const feedbackExplain = document.getElementById('feedbackExplain');

  if (correct) {
    state.lessonCorrect++;
    feedback.className = 'feedback-banner correct';
    feedbackIcon.textContent = '✅';
    feedbackText.textContent = randomCorrectMsg();
    feedbackExplain.textContent = step.explain || '';
  } else {
    state.lessonHearts = Math.max(0, state.lessonHearts - 1);
    document.getElementById('lessonHearts').textContent = state.lessonHearts;
    feedback.className = 'feedback-banner wrong';
    feedbackIcon.textContent = '❌';
    feedbackText.textContent = randomWrongMsg();
    feedbackExplain.textContent = step.explain || '';
  }

  checkBtn.textContent = 'CONTINUE';
  checkBtn.className = 'check-btn continue';
}

function randomCorrectMsg() {
  const msgs = ['Correct!', 'Excellent!', 'Nailed it!', 'Perfect!', 'Great job!', 'You got it!', 'Well done!', 'Brilliant!'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function randomWrongMsg() {
  const msgs = ['Not quite!', 'Incorrect', 'Wrong answer', 'Oops!', 'Not this time'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function showComplete() {
  const lid = `${state.currentUnit}-${state.currentLesson}`;
  const isNew = !state.completedLessons.includes(lid);
  if (isNew) {
    state.completedLessons.push(lid);
  }
  const xpEarned = isNew ? 15 : 5;
  state.xp += xpEarned;
  state.hearts = Math.min(5, state.hearts + 1);

  // Update streak (simple: just increment)
  state.streak = (state.streak || 0) + 1;

  saveState();
  updateNav();

  document.getElementById('completeXP').textContent = `+${xpEarned}`;
  const accuracy = state.lessonTotal > 0 ? Math.round((state.lessonCorrect / state.lessonTotal) * 100) : 100;
  document.getElementById('completeAccuracy').textContent = accuracy + '%';

  const subtitles = [
    'You\'re becoming a bridge master!',
    'Keep up the great work!',
    'Your bridge skills are growing!',
    'One step closer to the bridge table!',
    'Amazing progress!'
  ];
  document.getElementById('completeSubtitle').textContent = subtitles[Math.floor(Math.random() * subtitles.length)];

  showScreen('complete');
}

function finishLesson() {
  showScreen('home');
  renderPath();
}

function exitLesson() {
  showScreen('home');
  renderPath();
}

// ===========================
// NAV & SCREENS
// ===========================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(name + 'Screen').classList.add('active');
}

function updateNav() {
  document.getElementById('xpCount').textContent = state.xp;
  document.getElementById('heartCount').textContent = state.hearts;
  document.getElementById('streakCount').textContent = state.streak;
}

// ===========================
// INIT
// ===========================
loadState();
updateNav();
renderPath();
</script>
